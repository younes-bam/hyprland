###################
### MY PROGRAMS ###
###################
#Programs
$terminal = kitty
$menu = ~/.config/rofi/dmenu/launcher.sh
$wallchanger = ~/.config/rofi/wallchanger/wallpaperpicker.sh
$wallpaper = ~/.local/bin/random_wallpaper.sh
$mainMod = SUPER

###################
### KEYBINDINGS ###
###################
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, X, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, T, togglefloating,
bind = $mainMod, D, exec,  $menu
bind = $mainMod, R, exec, $wallpaper
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, V, togglesplit, # dwindle
# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
# Move focus with the arrow keys too
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

#swap window
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d
# Swap windows with Shift + Super + arrow keys too
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

#reload waybar
bind = $mainMod SHIFT, C, exec, pkill waybar && hyprctl dispatch exec waybar

# French AZERTY top row: & é " ' ( - è _ ç à
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = $mainMod, minus, workspace, 6
bind = $mainMod, egrave, workspace, 7
bind = $mainMod, underscore, workspace, 8
bind = $mainMod, ccedilla, workspace, 9
bind = $mainMod, agrave, workspace, 10
# Super + Shift + the same physical keys moves the active window.
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9
bind = $mainMod SHIFT, agrave, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

#switch workspaces with bracket
bind = $mainMod, bracketright, workspace, e+1
bind = $mainMod, bracketleft, workspace, e-1
#mousepad
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, Control_L, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER, ALT_L, resizewindow
#kitty-float
bind =$mainMod SHIFT, Return, exec,kitty --title=kitty-float
#walscript
bind = $mainMod, W, exec, $wallchanger

#screenshoot
bind = , PRINT, exec, bash -c 'ts=$(date +%s); dir="$HOME/Pictures/Screenshots"; mkdir -p "$dir"; file="$dir/${ts}_fullscreen.png"; grim "$file" && wl-copy < "$file" && notify-send -i "$file" "Full Screenshot" "Saved and copied to clipboard" -t 2300'
bind= $mainMod, PRINT, exec, bash -c 'ts=$(date +%s); dir="$HOME/Pictures/Screenshots"; mkdir -p "$dir"; file="$dir/${ts}_window.png"; grim -g "$(slurp -w 0)" "$file" && wl-copy < "$file" && notify-send -i "$file" "Window Screenshot" "Saved and copied to clipboard"'
bind = $mainMod SHIFT,PRINT, exec, bash -c 'ts=$(date +%Y-%m-%d_%H); dir="$HOME/Pictures/Screenshots"; mkdir -p "$dir"; file="$dir/${ts}_grim.png"; grim -g "$(slurp)" "$file" && wl-copy < "$file" && notify-send -i "$file" "Screenshot Taken" "Saved and copied to clipboard" -t 2300'

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Music controls are available through the MPRIS widget and SwayNC.
bind = $mainMod CTRL, PRINT, exec, bash -c 'ts=$(date +%s); dir="$HOME/Pictures/Screenshots"; mkdir -p "$dir"; file="$dir/${ts}_window.png"; region=$(slurp); [ -n "$region" ] && grim -g "$region" "$file" && wl-copy < "$file" && notify-send -i "$file" "Window Screenshot" "Saved and copied to clipboard"'

# Laptop multimedia keys for volume and LCD brightness
#bindel = ,XF86AudioRaiseVolume, exec, amixer set Master  5%+
bindel = ,XF86AudioRaiseVolume, exec, ~/.local/bin/volume_notif.sh volume_up
#bindel = ,XF86AudioLowerVolume, exec, amixer set Master  5%-
bindel = ,XF86AudioLowerVolume, exec, ~/.local/bin/volume_notif.sh volume_down
#bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMute, exec, ~/.local/bin/volume_notif.sh volume_mute 
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Brightness keys
binde = , XF86MonBrightnessUp, exec, ~/.local/bin/bright_notif.sh 5%+
binde = , XF86MonBrightnessDown, exec, ~/.local/bin/bright_notif.sh 5%-
bind = , XF86PowerOff, exec, ~/.config/hypr/Scripts/wlogout.sh
